name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: check types
        run: pnpm check-types

      # typescript-eslint declares `typescript <6.1.0`, and this repo compiles
      # with TypeScript 7, so ESLint cannot load its parser yet. Types and tests
      # are the blocking gates until the plugin catches up.
      - name: lint
        run: pnpm lint
        continue-on-error: true

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
